# Check out https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/ for more information

workflows:
  react-native-android:
    name: React Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      groups:
        - google_credentials
      vars:
        PACKAGE_NAME: "com.techcrate.app"
      node: v22.13.1
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
      - mobile/android/app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - dev@techcrate.com
        notify:
          success: true
          failure: true

  react-native-ios:
    name: React Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      vars:
        XCODE_WORKSPACE: "ios/projectkart.xcworkspace"
        XCODE_SCHEME: "TechCrate"
        BUNDLE_ID: "com.techcrate.app"
      node: v22.13.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Build iOS app
        script: |
          xcodebuild build -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release CODE_SIGNING_ALLOWED=NO
    artifacts:
      - mobile/ios/build/Build/Products/Release-iphoneos/*.app
    publishing:
      email:
        recipients:
          - dev@techcrate.com
        notify:
          success: true
          failure: true
